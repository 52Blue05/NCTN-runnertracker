# ===========================
# Production Profile (Railway.app)
# ===========================
spring.application.name=runnertracker
server.port=${PORT:8080}

# ===========================
# DataSource — Railway MySQL Addon
# Railway tự cung cấp các biến: MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
# ===========================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===========================
# JWT Configuration
# ===========================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ===========================
# Connection Pool — giảm bộ nhớ trên Railway (1 GB)
# ===========================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ===========================
# Spring Data — default page size
# ===========================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

